<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 275" role="img" aria-labelledby="title-12 desc-12"><title id="title-12">Long Run Hole 12 — routing concept</title><desc id="desc-12">A direct diagonal connection from the tee area toward a green southwest of it on the north-up municipal map. Tree cover around the corridor. Original illustrative contours, not measured course geometry. Tee area is not tee-specific; no carry distances or target zone are shown.</desc><defs><linearGradient id="fairway-12" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#a6c09c"/><stop offset="1" stop-color="#bfd1af"/></linearGradient><linearGradient id="trees-12" x1="0" x2="1"><stop stop-color="#739575" stop-opacity=".22"/><stop offset="1" stop-color="#496e53" stop-opacity=".08"/></linearGradient><radialGradient id="canvas-12"><stop stop-color="#f3f5ed"/><stop offset="1" stop-color="#eaf0e7"/></radialGradient></defs><rect width="320" height="275" rx="10" fill="url(#canvas-12)"/><path d="M 56 220 C 64 160 49 103 72 47 L 98 41 C 86 107 95 162 88 221 Z" fill="url(#trees-12)"/><path d="M 216 220 C 229 162 202 114 199 63 L 224 53 C 231 118 257 164 248 222 Z" fill="url(#trees-12)"/><path d="M 155 230 C 152 195 135 173 128 147 C 120 121 121 95 118 71 L 150 61 C 161 90 158 110 169 139 C 179 166 197 197 185 229 Z" fill="url(#fairway-12)" stroke="#8fac86" stroke-width="1" stroke-dasharray="3 3"/><ellipse cx="133" cy="56" rx="27" ry="20" fill="#8eac83" opacity=".4"/><ellipse cx="133" cy="56" rx="24" ry="17" fill="#4e7757"/><path d="M 122 57 Q 133 50 145 55" fill="none" stroke="#6f936e" stroke-width=".7"/><rect x="165" y="240" width="14" height="6" rx="2" fill="#315b42" stroke="#fff" stroke-width="1"/><text x="167" y="59" font-family="-apple-system,Segoe UI,sans-serif" font-size="9" fill="#526453">Green area</text><text x="172" y="260" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="8" fill="#647261">Tee area</text><text x="12" y="18" font-family="-apple-system,Segoe UI,sans-serif" font-size="8" letter-spacing=".6" fill="#526453">ROUTING CONCEPT · NOT TO SCALE</text></svg>
